<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Manometer Outer Rim -->
  <circle cx="16" cy="16" r="12.5" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2.2"/>
  <!-- Calibration Ticks Arc (Bottom-left to Bottom-right) -->
  <path d="M8.5 22 A 10 10 0 1 1 23.5 22" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Redline Rupture Zone (Top Right) -->
  <path d="M21 9 A 10 10 0 0 1 24.5 16" stroke="#ef4444" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Center Needle Pivot -->
  <circle cx="16" cy="17" r="2.2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <!-- High Pressure Indicator Needle pointing into Redline -->
  <line x1="16" y1="17" x2="21" y2="10" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom Stem Mount -->
  <rect x="14" y="28.5" width="4" height="2.5" fill="#d97706"/>
</svg>
