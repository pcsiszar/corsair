<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Armor Diamond Tile with Critical Hazard Inset -->
  <polygon points="16,3 29,16 16,29 3,16" fill="#991b1b" fill-opacity="0.3" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Bold X Strike (Aggravated Cross) -->
  <line x1="22" y1="10" x2="10" y2="22" stroke="#ef4444" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="22" y2="22" stroke="#ef4444" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Center Core Impact Node -->
  <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>
  <!-- Perimeter Breach Ticks -->
  <line x1="16" y1="3" x2="16" y2="7" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="29" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
</svg>
